<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Temperature Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.dark-mode .container {
            background: #1e1e2e;
            color: #e0e0e0;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #2c3e50;
            font-size: 26px;
            transition: color 0.5s ease;
        }

        body.dark-mode h1 {
            color: #e0e0e0;
        }

        .theme-toggle {
            background: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: rotate(20deg) scale(1.1);
        }

        body.dark-mode .theme-toggle {
            background: #2d2d44;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        body.dark-mode .input-section label {
            color: #aaa;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        body.dark-mode .input-group input {
            background: #2d2d44;
            border-color: #444;
            color: #e0e0e0;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-group select {
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            background: #f9f9f9;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }

        body.dark-mode .input-group select {
            background: #2d2d44;
            border-color: #444;
            color: #e0e0e0;
        }

        .input-group select:focus {
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .convert-btn {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .convert-btn:active {
            transform: translateY(0);
        }

        .clear-btn {
            background: #f0f0f0;
            color: #555;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        body.dark-mode .clear-btn {
            background: #2d2d44;
            color: #aaa;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-card {
            background: #f8f9fc;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e8ecf4;
            transition: all 0.3s ease;
        }

        body.dark-mode .result-card {
            background: #25253a;
            border-color: #3a3a55;
        }

        .result-card .unit {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .result-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        body.dark-mode .result-card .value {
            color: #8b9aff;
        }

        .result-card .symbol {
            font-size: 18px;
            color: #764ba2;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            min-height: 20px;
            text-align: center;
        }

        .history-section {
            margin-top: 25px;
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
        }

        body.dark-mode .history-section {
            border-top-color: #3a3a55;
        }

        .history-section h3 {
            font-size: 15px;
            color: #555;
            margin-bottom: 12px;
        }

        body.dark-mode .history-section h3 {
            color: #aaa;
        }

        .history-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-list li {
            padding: 10px 12px;
            background: #f8f9fc;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        body.dark-mode .history-list li {
            background: #25253a;
        }

        .history-list li .history-result {
            font-weight: bold;
            color: #667eea;
        }

        .history-list .empty-message {
            color: #aaa;
            font-style: italic;
            text-align: center;
            background: transparent;
            justify-content: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 20px;
            }

            .input-group {
                flex-direction: column;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌡️ Temp Converter</h1>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
    </div>
    <p class="subtitle">Celsius ↔ Fahrenheit ↔ Kelvin</p>

    <div class="input-section">
        <label for="temperatureInput">Enter Temperature:</label>
        <div class="input-group">
            <input type="number" id="temperatureInput" placeholder="0" step="any">
            <select id="unitSelect">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>
    </div>

    <div class="button-group">
        <button class="convert-btn" onclick="convertTemperature()">Convert</button>
        <button class="clear-btn" onclick="clearAll()" title="Clear">🗑️</button>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <div class="results-grid" id="resultsGrid" style="display: none;">
        <div class="result-card">
            <div class="unit">Celsius</div>
            <div class="value" id="resultCelsius">0</div>
            <div class="symbol">°C</div>
        </div>
        <div class="result-card">
            <div class="unit">Fahrenheit</div>
            <div class="value" id="resultFahrenheit">0</div>
            <div class="symbol">°F</div>
        </div>
        <div class="result-card">
            <div class="unit">Kelvin</div>
            <div class="value" id="resultKelvin">0</div>
            <div class="symbol">K</div>
        </div>
    </div>

    <div class="history-section">
        <h3>📋 Conversion History</h3>
        <ul class="history-list" id="historyList">
            <li class="empty-message">No conversions yet</li>
        </ul>
    </div>

    <div class="footer">
        Built with HTML, CSS & JavaScript
    </div>
</div>

<script>
    const temperatureInput = document.getElementById('temperatureInput');
    const unitSelect = document.getElementById('unitSelect');
    const errorMessage = document.getElementById('errorMessage');
    const resultsGrid = document.getElementById('resultsGrid');
    const historyList = document.getElementById('historyList');

    let conversionHistory = [];
    let isDarkMode = false;

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode');
        document.querySelector('.theme-toggle').textContent = isDarkMode ? '☀️' : '🌙';
    }

    function toCelsius(value, unit) {
        if (unit === 'C') return value;
        if (unit === 'F') return (value - 32) * 5 / 9;
        if (unit === 'K') return value - 273.15;
        return value;
    }

    function fromCelsius(celsius) {
        return {
            C: celsius,
            F: (celsius * 9 / 5) + 32,
            K: celsius + 273.15
        };
    }

    function validateInput(value) {
        if (value === '' || value === null) {
            return { valid: false, message: '⚠️ Please enter a temperature value.' };
        }

        const num = parseFloat(value);
        if (isNaN(num)) {
            return { valid: false, message: '⚠️ Please enter a valid number.' };
        }

        if (num < -273.15 && unitSelect.value === 'C') {
            return { valid: false, message: '⚠️ Temperature cannot be below absolute zero (-273.15°C).' };
        }

        return { valid: true, value: num };
    }

    function convertTemperature() {
        errorMessage.textContent = '';

        const inputValue = temperatureInput.value;
        const selectedUnit = unitSelect.value;

        const validation = validateInput(inputValue);
        if (!validation.valid) {
            errorMessage.textContent = validation.message;
            resultsGrid.style.display = 'none';
            return;
        }

        const inputTemp = validation.value;
        const celsius = toCelsius(inputTemp, selectedUnit);
        const results = fromCelsius(celsius);

        document.getElementById('resultCelsius').textContent = results.C.toFixed(2);
        document.getElementById('resultFahrenheit').textContent = results.F.toFixed(2);
        document.getElementById('resultKelvin').textContent = results.K.toFixed(2);

        resultsGrid.style.display = 'grid';

        addToHistory(inputTemp, selectedUnit, results);
    }

    function addToHistory(input, unit, results) {
        const unitSymbols = { C: '°C', F: '°F', K: 'K' };

        const entry = {
            input: ${input}${unitSymbols[unit]},
            celsius: ${results.C.toFixed(2)}°C,
            fahrenheit: ${results.F.toFixed(2)}°F,
            kelvin: ${results.K.toFixed(2)}K
        };

        conversionHistory.unshift(entry);
        if (conversionHistory.length > 5) {
            conversionHistory.pop();
        }

        renderHistory();
    }

    function renderHistory() {
        if (conversionHistory.length === 0) {
            historyList.innerHTML = '<li class="empty-message">No conversions yet</li>';
            return;
        }

        historyList.innerHTML = '';
        conversionHistory.forEach(function (entry) {
            const li = document.createElement('li');
            li.innerHTML = <span>${entry.input}</span> <span class="history-result">${entry.celsius}</span>;
            historyList.appendChild(li);
        });
    }

    function clearAll() {
        temperatureInput.value = '';
        errorMessage.textContent = '';
        resultsGrid.style.display = 'none';
        temperatureInput.focus();
    }

    temperatureInput.addEventListener('keypress', function (event) {
        if (event.key === 'Enter') {
            convertTemperature();
        }
    });

    temperatureInput.addEventListener('input', function () {
        errorMessage.textContent = '';
    });

    renderHistory();
</script>

</body>
</html>
